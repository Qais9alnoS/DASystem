[package]
name = "school_scheduler_backend"
version = "0.1.0"
edition = "2024"
authors = ["Your Name"]
description = "Backend for school schedule generator using Rust"

[dependencies]
# Tauri integration
tauri = { version = "1.0", features = ["api-all"], optional = true }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.0", features = ["full"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
async-std = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
lazy_static = "1.0"

# Random generation
rand = "0.8"

[build-dependencies]
tauri-build = { version = "1.0", optional = true }

[features]
tauri = ["dep:tauri", "dep:tauri-build"]

[dev-dependencies]
assertions = "0.1.0"
